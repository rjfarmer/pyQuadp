name:  PyPy
on: [push, pull_request]
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        toolchain:
          - {compiler: gcc, version: 12}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PyPy
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 'pypy3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get install -y libopenblas-dev
          pypy3 -m pip install build wheel pip-tools typing_extensions
          pip-compile -o requirements.txt --extra test --strip-extras -P 'hypothesis<6.156'
          pypy3 -m pip install -r requirements.txt


      - uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72 # v1.9.0
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
    
      - name: Build
        run: |
          pypy3 -m build
          pypy3 -m pip install dist/pyquadp*.whl

      - name: Test
        # Don't use python -m pytest as that screws up the module loading
        run: |
          pytest -v
